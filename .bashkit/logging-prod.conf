# logging-prod.conf - Production example bash-logger configuration file
#
# Lines starting with # or ; are comments
# Blank lines are ignored
#
# Reference: https://github.com/GingerGraham/bash-logger/blob/2.5.6/docs/configuration.md

# TODO configure example settings
[logging]
level = INFO
color = auto
format = %d %z [%l] [%s] %m
journal = true
tag = bashkit
facility = daemon
utc = true
# Minimum level for stderr output
# Set to DEBUG so all console log output (not just ERROR+) goes to stderr,
# keeping stdout clean for functions whose return value is captured via
# command substitution (e.g. get_app_name(), ignition::merge_read_inline_path()).
# Otherwise, enabling VERBOSE/DEBUG logging corrupts those captures with
# interleaved log text.
stderr_level = DEBUG
quiet = false
