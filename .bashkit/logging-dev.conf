# logging-dev.conf - Development bash-logger configuration file
#
# Used for local development logging configuration
# Lines starting with # or ; are comments
# Blank lines are ignored
#
# Reference: https://github.com/GingerGraham/bash-logger/blob/2.5.6/docs/configuration.md

[logging]
# Log level: DEBUG, INFO, NOTICE, WARN, ERROR, CRITICAL, ALERT, EMERGENCY
# level = INFO

# Log message format
# Variables: %d=datetime, %z=timezone, %l=level, %s=script, %m=message
#
# Detailed format
# format = %d %z [%l] [%s] %m
format = [%l] %d - %m

# Log file: not set here. log_file must be an absolute path, and this file
# ships to consumers, so development sets BASHKIT_LOG_FILE instead (.envrc
# points it at <bashkit>/.log/dev.log) and core::logger_init passes --log.
# log_file =

# Enable systemd journal logging: true/false
journal = false

# Syslog facility for journal entries
facility = user

# Color mode: auto, always, never
# color = auto
color = always

# Minimum level for stderr output
# Set to DEBUG so all console log output (not just ERROR+) goes to stderr,
# keeping stdout clean for functions whose return value is captured via
# command substitution (e.g. get_app_name(), ignition::merge_read_inline_path()).
# Otherwise, enabling VERBOSE/DEBUG logging corrupts those captures with
# interleaved log text.
stderr_level = DEBUG

# Disable console output: true/false
# quiet = false

# Enable debug logging: true/false
# verbose = false

# Allow newlines in log messages: true/false
# Warning: true disables sanitization and can allow log injection
# unsafe_allow_newlines = false

# Allow ANSI color codes in log messages: true/false
# Warning: true disables ANSI sanitization and can allow escape-sequence injection
# unsafe_allow_ansi_codes = false

# Maximum message length before formatting for console/file output (0 = unlimited)
# Note: Final output line may exceed this due to timestamp, level, and script name
# max_line_length = 4096

# Maximum message length before formatting for journal output (0 = unlimited)
# Note: Final journal entry may exceed this due to metadata
# max_journal_length = 4096
