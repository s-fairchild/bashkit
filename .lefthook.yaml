# https://lefthook.dev/configuration/
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    lint:
      glob:
        - "**/*.sh"
        - "**/*.env"
        - "**/*.envrc"
        - "local/bin/*"
      exclude:
        - vendor/*
      run: shellcheck "{staged_files}"

    # Scans staged changes with .gitleaks.toml. In a `git worktree` or a
    # submodule, .git is a file pointing outside the checkout, so the checkout
    # and git's common dir are both mounted, at the physical paths git
    # reports. Not ${PWD}: it keeps any symlink the commit was made through,
    # and a submodule's .git file and core.worktree are relative paths that
    # would then resolve to nothing mounted. `git commit -a` and
    # `git commit <paths>` stage into a temporary index that git names in
    # GIT_INDEX_FILE; it's passed in too, or gitleaks scans the old index.
    # gitleaks logs git errors but still exits 0 with "no leaks found", so the
    # container first checks that git can find the repo and the index.
    gitleaks:
      run: |
        top="$(git rev-parse --show-toplevel)"
        common="$(git rev-parse --path-format=absolute --git-common-dir)"
        index="$(git rev-parse --path-format=absolute --git-path index)"
        set -- -v "${top}:${top}:O"
        case "${common}" in
          "${top}"/*) ;;
          *) set -- "$@" -v "${common}:${common}:O" ;;
        esac
        podman run --rm --network=none "$@" -e GIT_INDEX_FILE="${index}" \
          --entrypoint sh ghcr.io/gitleaks/gitleaks:latest -c '
            git -C "$1" rev-parse --git-dir >/dev/null || exit
            if [ ! -f "${GIT_INDEX_FILE}" ]; then
              echo "gitleaks: index ${GIT_INDEX_FILE} is not mounted" >&2
              exit 1
            fi
            exec gitleaks git --pre-commit --staged --redact --no-banner -v "$1"
          ' sh "${top}"
